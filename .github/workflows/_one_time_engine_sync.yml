name: one-time-engine-sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact engine project closure
        shell: bash
        run: |
          set -euo pipefail
          SRC_REPO='duonghai258-beep/DT.BK_New_1'
          SRC_REF='main'
          SRC_ROOT="https://raw.githubusercontent.com/${SRC_REPO}/${SRC_REF}"
          TREE_URL="https://api.github.com/repos/${SRC_REPO}/git/trees/${SRC_REF}?recursive=1"
          rm -rf /tmp/source-tree.json /tmp/source-paths.txt
          curl -fsSL --user-agent 'ESCONTODTBK-engine-sync' "$TREE_URL" -o /tmp/source-tree.json
          jq -e '.truncated == false' /tmp/source-tree.json >/dev/null
          jq -r '.tree[] | select(.type == "blob") | .path | select(startswith("src/DTBK.Engine/") or startswith("src/DTBK.Domain/") or startswith("src/DTBK.Policy/") or startswith("src/DTBK.Coefficient/"))' /tmp/source-tree.json | sort > /tmp/source-paths.txt
          test -s /tmp/source-paths.txt
          test -f ESCON_ENGINE.sln
          rm -rf src engine DataPack docs reports evidence .github
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --user-agent 'ESCONTODTBK-engine-sync' "$SRC_ROOT/$path" -o "$path"
          done < /tmp/source-paths.txt
          while IFS= read -r path; do test -f "$path"; done < /tmp/source-paths.txt
          find src/DTBK.Engine src/DTBK.Domain src/DTBK.Policy src/DTBK.Coefficient -type f -printf '%P\n' | sort | sed 's#^#src/#' > /tmp/dest-paths.txt
          diff -u /tmp/source-paths.txt /tmp/dest-paths.txt
          grep -F '<ProjectReference Include="..\\DTBK.Domain\\DTBK.Domain.csproj" />' src/DTBK.Engine/DTBK.Engine.csproj
          grep -F '<ProjectReference Include="..\\DTBK.Policy\\DTBK.Policy.csproj" />' src/DTBK.Engine/DTBK.Engine.csproj
          grep -F '<ProjectReference Include="..\\DTBK.Coefficient\\DTBK.Coefficient.csproj" />' src/DTBK.Engine/DTBK.Engine.csproj
          dup=$(find src/DTBK.Engine src/DTBK.Domain src/DTBK.Policy src/DTBK.Coefficient -type f -printf '%f\n' | sort | uniq -d)
          test -z "$dup" || { echo 'DUPLICATE_FILENAMES'; printf '%s\n' "$dup"; exit 1; }
          bad=$(find . -type f -not -path './.git/*' | grep -Ev '^\./(ESCON_ENGINE\.sln|src/DTBK\.(Engine|Domain|Policy|Coefficient)/.*)$' || true)
          test -z "$bad" || { echo 'CLEAN_SCOPE_FAIL'; printf '%s\n' "$bad"; exit 1; }
          dotnet build ESCON_ENGINE.sln --configuration Release
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: sync complete ESCON engine software closure from New_1'
          git push origin HEAD:main
