name: Bootstrap ESCON Engine Partial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Import clean DTBK engine source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/target /tmp/source
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/duonghai258-beep/ESCONTODTBK.git" /tmp/target
          git clone --depth 1 https://github.com/duonghai258-beep/DT.BK_New_1.git /tmp/source

          cd /tmp/target
          rm -rf .github src tests BOOTSTRAP_TRIGGER.txt
          mkdir -p src
          cp -R /tmp/source/src/DTBK.Domain src/
          cp -R /tmp/source/src/DTBK.Policy src/
          cp -R /tmp/source/src/DTBK.Coefficient src/
          cp -R /tmp/source/src/DTBK.Engine src/

          cat > ESCON_ENGINE_PARTIAL.sln <<'EOF'
Microsoft Visual Studio Solution File, Format Version 12.00
# Visual Studio Version 17
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "DTBK.Domain", "src/DTBK.Domain/DTBK.Domain.csproj", "{11111111-1111-1111-1111-111111111111}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "DTBK.Policy", "src/DTBK.Policy/DTBK.Policy.csproj", "{22222222-2222-2222-2222-222222222222}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "DTBK.Coefficient", "src/DTBK.Coefficient/DTBK.Coefficient.csproj", "{CCCCCCCC-CCCC-CCCC-CCCC-CCCCCCCCCCCC}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "DTBK.Engine", "src/DTBK.Engine/DTBK.Engine.csproj", "{55555555-5555-5555-5555-555555555555}"
EndProject
Global
	GlobalSection(SolutionConfigurationPlatforms) = preSolution
		Debug|Any CPU = Debug|Any CPU
		Release|Any CPU = Release|Any CPU
	EndGlobalSection
EndGlobal
EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap clean ESCON partial engine source"
          git push origin HEAD:main
