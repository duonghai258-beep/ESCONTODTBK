name: Import clean DTBK engine source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import only engine software
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/dtbk-source
          git clone --depth 1 https://github.com/duonghai258-beep/DT.BK_New_1.git /tmp/dtbk-source

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p src

          # Engine source plus its direct compile-time project dependencies only.
          cp -R /tmp/dtbk-source/src/DTBK.Domain src/
          cp -R /tmp/dtbk-source/src/DTBK.Policy src/
          cp -R /tmp/dtbk-source/src/DTBK.Coefficient src/
          cp -R /tmp/dtbk-source/src/DTBK.Engine src/

          # Remove build/generated artifacts if present.
          find src -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

          dotnet --version
          dotnet new sln -n ESCON_ENGINE_PARTIAL --force
          dotnet sln ESCON_ENGINE_PARTIAL.sln add \
            src/DTBK.Domain/DTBK.Domain.csproj \
            src/DTBK.Policy/DTBK.Policy.csproj \
            src/DTBK.Coefficient/DTBK.Coefficient.csproj \
            src/DTBK.Engine/DTBK.Engine.csproj

          dotnet restore ESCON_ENGINE_PARTIAL.sln
          dotnet build ESCON_ENGINE_PARTIAL.sln --configuration Release --no-restore

          # Hard guard: this repository must contain software source only.
          test -f ESCON_ENGINE_PARTIAL.sln
          test -f src/DTBK.Engine/DTBK.Engine.csproj
          test -f src/DTBK.Domain/DTBK.Domain.csproj
          test -f src/DTBK.Policy/DTBK.Policy.csproj
          test -f src/DTBK.Coefficient/DTBK.Coefficient.csproj
          if find . -type f \( -name '*.md' -o -name '*.log' -o -name '*.exe' -o -name '*.dll' -o -name '*.zip' \) -not -path './.git/*' | grep -q .; then
            echo 'Forbidden non-source artifact found'
            exit 1
          fi

      - name: Remove bootstrap workflow and commit clean source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .github
          rm -rf src/*/bin src/*/obj
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import clean ESCON partial engine source'
          git push origin HEAD:main
